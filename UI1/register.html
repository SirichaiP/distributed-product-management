<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPMS — Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563EB; --primary-dark: #1D4ED8; --accent: #F59E0B;
    --bg: #0F172A; --surface: #1E293B; --border: rgba(255,255,255,0.08);
    --text: #F1F5F9; --muted: #94A3B8; --success: #10B981;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image: linear-gradient(rgba(37,99,235,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(37,99,235,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .bg-glow { position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; }
  .bg-glow-1 { width: 500px; height: 500px; background: rgba(37,99,235,0.12); top: -150px; right: -100px; }
  .bg-glow-2 { width: 350px; height: 350px; background: rgba(16,185,129,0.08); bottom: -80px; left: -80px; }

  .register-card {
    position: relative; z-index: 1;
    background: var(--surface);
    border-radius: 20px;
    padding: 48px 52px;
    width: 460px;
    max-width: 95vw;
    box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
    animation: slideUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }

  .card-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
  .card-brand-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(37,99,235,0.4);
  }
  .card-brand-icon svg { width: 22px; height: 22px; }
  .card-brand-name { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 1px; }

  .form-title { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .form-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 32px; }

  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 7px; }
  .input-wrap { position: relative; }
  .input-wrap svg.field-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); pointer-events: none; transition: color 0.2s; }
  .form-input {
    width: 100%; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 9px;
    padding: 11px 13px 11px 40px;
    font-size: 14px; color: var(--text); font-family: 'DM Sans', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s; outline: none;
  }
  .form-input::placeholder { color: var(--muted); opacity: 0.6; }
  .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.18); }
  .form-input:focus ~ svg.field-icon { color: var(--primary); }

  .strength-bar { margin-top: 8px; display: flex; gap: 4px; }
  .strength-segment { flex: 1; height: 3px; border-radius: 2px; background: var(--border); transition: background 0.3s; }
  .strength-segment.active-1 { background: #EF4444; }
  .strength-segment.active-2 { background: #F59E0B; }
  .strength-segment.active-3 { background: var(--success); }
  .strength-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; }
  .eye-btn svg { width: 15px; height: 15px; display: block; }

  .btn-register {
    width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border: none; border-radius: 9px;
    padding: 13px; font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer;
    letter-spacing: 0.5px; margin-top: 8px;
    transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    box-shadow: 0 4px 20px rgba(37,99,235,0.4);
  }
  .btn-register:hover { filter: brightness(1.1); transform: translateY(-1px); }

  .signin-link { text-align: center; font-size: 13px; color: var(--muted); margin-top: 20px; }
  .signin-link a { color: var(--accent); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="register-card">
  <div class="card-brand">
    <div class="card-brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
    </div>
    <span class="card-brand-name">DPMS</span>
  </div>

  <h1 class="form-title">Create an account</h1>
  <p class="form-subtitle">เริ่มต้นใช้งานระบบจัดการสินค้าของคุณได้เลย</p>

  <div class="form-group">
    <label class="form-label">Full Name</label>
    <div class="input-wrap">
      <input class="form-input" type="text" placeholder="John Doe">
      <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Email Address</label>
    <div class="input-wrap">
      <input class="form-input" type="email" placeholder="john@example.com">
      <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Password</label>
    <div class="input-wrap">
      <input class="form-input" type="password" id="pass1" placeholder="••••••••••" oninput="checkStrength(this.value)">
      <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <button class="eye-btn" onclick="toggle('pass1')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="strength-bar">
      <div class="strength-segment" id="s1"></div>
      <div class="strength-segment" id="s2"></div>
      <div class="strength-segment" id="s3"></div>
    </div>
    <div class="strength-label" id="strengthLabel">ความแข็งแกร่งของรหัสผ่าน</div>
  </div>

  <div class="form-group">
    <label class="form-label">Confirm Password</label>
    <div class="input-wrap">
      <input class="form-input" type="password" id="pass2" placeholder="••••••••••">
      <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <button class="eye-btn" onclick="toggle('pass2')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </div>

  <button class="btn-register">Register</button>
  <p class="signin-link">Already have an account? <a href="login.html">Sign in</a></p>
</div>

<script>
function toggle(id) {
  const i = document.getElementById(id);
  i.type = i.type === 'password' ? 'text' : 'password';
}
function checkStrength(val) {
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const labels = ['', 'อ่อนแอ', 'ปานกลาง', 'แข็งแกร่ง'];
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById('s'+i);
    el.className = 'strength-segment' + (i <= score ? ' active-'+score : '');
  }
  document.getElementById('strengthLabel').textContent = val.length ? labels[score] || 'อ่อนแอ' : 'ความแข็งแกร่งของรหัสผ่าน';
}
</script>
</body>
</html>
